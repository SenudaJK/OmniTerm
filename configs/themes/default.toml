# --- CLEAN TWO-LINE PROMPT ---
format = """[ $directory ](bg:#1e293b fg:#38bdf8)[git: $git_branch $git_status](bg:#1e293b fg:#c084fc)[ $azure](bg:#1e293b)[ $kubernetes](bg:#1e293b)[ $aws](bg:#1e293b)[ ${custom.cpu}](bg:#1e293b)[ $cmd_duration ](bg:#1e293b fg:#facc15)
$character"""

# This places the time module on the far right of your terminal
right_format = "$time"

[directory]
style = "bold fg:#38bdf8 bg:#1e293b"
format = "[$path]($style)"
truncate_to_repo = true

[git_branch]
symbol = " "
style = "fg:#c084fc bg:#1e293b"
format = '[$symbol$branch(:$remote_branch)]($style)'

[git_status]
style = "fg:#fb923c bg:#1e293b"
format = '[$all_status$ahead_behind]($style)'
ahead = '⇡'
behind = '⇣'
diverged = '⇕'

# --- AZURE ---
[azure]
symbol = "󰠅 "
format = '[$symbol($subscription)]($style)'
style = "fg:#38bdf8 bg:#1e293b"
disabled = false

# --- KUBERNETES & PRODUCTION ALARM ---
[kubernetes]
symbol = "☸ "
format = '[⛵ $symbol($context \($namespace\))]($style)'
style = "fg:#4ade80 bg:#1e293b"
disabled = false

[[kubernetes.contexts]]
context_pattern = "[Pp][Rr][Oo][Dd]"
style = "bold bg:#ef4444 fg:#ffffff"

[[kubernetes.contexts]]
context_pattern = "(staging|uat|Staging|UAT)"
style = "bold bg:#eab308 fg:#000000"

# --- AWS ---
[aws]
symbol = "☁️ "
format = '[$symbol($profile)]($style)'
style = "fg:#fbbf24 bg:#1e293b"
disabled = false

[docker_context]
symbol = "🐳 "
style = "fg:#0db7ed bg:#1e293b"
format = '[$symbol$context]($style)'

[package]
symbol = "📦 "
style = "fg:#f28e2c bg:#1e293b"
format = '[$symbol$version]($style)'

# --- NODE.JS ---
[nodejs]
symbol = " "
style = "fg:#4ade80 bg:#1e293b"
format = '[$symbol($version)]($style)'
disabled = false

# --- PYTHON ---
[python]
symbol = " "
style = "fg:#facc15 bg:#1e293b"
format = '[$symbol($version)]($style)'
disabled = false

# --- SYSTEM METRICS (CPU SKULL) ---
[custom.cpu]
command = "ps -A -o %cpu | awk -v cores=$(sysctl -n hw.ncpu) '{s+=$1} END {printf(\"%.0f%%\", s/cores)}'"
when = "true"
style = "fg:#f87171 bg:#1e293b"
format = '[💀 $output]($style)'

# --- COMMAND DURATION (e.g., took 4s) ---
[cmd_duration]
min_time = 2000
style = "fg:#facc15 bg:#1e293b"
format = '[took $duration]($style)'
disabled = false

# --- TIME MODULE ---
[time]
disabled = false
time_format = "%I:%M %p"
style = "bold fg:#fb923c"
format = '[\[$time\]]($style)'

[character]
success_symbol = '[❯](bold #38bdf8)'
error_symbol = '[❯](bold #ef4444)'