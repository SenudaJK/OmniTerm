# --- MAIN PROMPT FORMAT WITH CLOUD & SAFETY ALARMS ---
format = """[ $directory ](bg:#21262d fg:#58a6ff)[git: $git_branch $git_status](bg:#21262d fg:#bc8cff)[ $azure](bg:#21262d)[ $kubernetes](bg:#21262d)[ $aws](bg:#21262d)[ $custom ](bg:#21262d)
[ $time]($time_style) $character"""

[directory]
style = "bold fg:#58a6ff bg:#21262d"
format = "[$path]($style)"
truncate_to_repo = true

[git_branch]
symbol = ""
style = "fg:#bc8cff bg:#21262d"
format = '[$branch]($style)'

[git_status]
style = "fg:#f0883e bg:#21262d"
format = '[$all_status$ahead_behind]($style)'

# --- AZURE ---
[azure]
symbol = "󰠅 "
format = '[$symbol($subscription)]($style)'
style = "fg:#38bdf8 bg:#21262d"
disabled = false

# --- KUBERNETES & PRODUCTION ALARM ---
[kubernetes]
symbol = "☸ "
format = '[$symbol($context \($namespace\))]($style)'
style = "fg:#4ade80 bg:#21262d"
disabled = false

[[kubernetes.contexts]]
context_pattern = "(?i).*prod.*"
style = "bold bg:#ff0000 fg:#ffffff"

[[kubernetes.contexts]]
context_pattern = "(?i).*(staging|uat).*"
style = "bold bg:#eab308 fg:#000000"

# --- AWS ---
[aws]
symbol = "☁️ "
format = '[$symbol($profile)]($style)'
style = "fg:#fbbf24 bg:#21262d"
disabled = false

# --- SYSTEM METRICS (CPU SKULL) ---
[custom.cpu]
command = "ps -A -o %cpu | awk -v cores=$(sysctl -n hw.ncpu) '{s+=$1} END {printf(\"%.0f%%\", s/cores)}'"
when = "true"
style = "fg:#ff7b72 bg:#21262d"
format = '[💀 $output]($style)'

# --- TIME MODULE ---
[time]
disabled = false
time_format = "%I:%M %p"
style = "bold fg:#f97316"
format = '[\[$time\]]($style)'