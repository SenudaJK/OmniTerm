# --- TOP STATUS LINE WITH ALL CLOUD PROVIDERS ---
format = """[ $directory](bg:#21262d fg:#58a6ff)[$git_branch $git_status](bg:#21262d)[ $azure](bg:#21262d)[ $aws](bg:#21262d)[ $kubernetes](bg:#21262d)[ $custom](bg:#21262d)
[ $time]($time_style) $character"""

[directory]
style = "bold fg:#58a6ff"
format = "[$path]($style)"
truncate_to_repo = true

[git_branch]
symbol = " "
style = "fg:#bc8cff bg:#21262d"
format = '[$symbol$branch]($style)'

[git_status]
style = "fg:#f0883e bg:#21262d"
format = '[$all_status$ahead_behind]($style)'

# --- AZURE SUBSCRIPTION ---
[azure]
symbol = "󰠅 "
style = "fg:#007fff bg:#21262d"
format = '[$symbol($subscription)]($style)'
disabled = false

# --- AWS PROFILE ---
[aws]
symbol = "  "
style = "fg:#ff9900 bg:#21262d"
format = '[$symbol($profile)]($style)'
disabled = false

# --- KUBERNETES CONTEXT (AKS / Connected Cluster) ---
[kubernetes]
symbol = "☸ "
style = "fg:#326ce5 bg:#21262d"
format = '[$symbol($context)]($style)'
disabled = false

# --- SYSTEM METRICS (CPU SKULL) ---
[custom.cpu]
command = "ps -A -o %cpu | awk -v cores=$(sysctl -n hw.ncpu) '{s+=$1} END {printf(\"%.0f%%\", s/cores)}'"
when = "true"
style = "fg:#ff7b72 bg:#21262d"
format = '[💀 $output]($style) '

# --- TIME MODULE ---
[time]
disabled = false
time_format = "%I:%M %p"
style = "bold fg:#f97316"
format = '[\[$time\]]($style)'