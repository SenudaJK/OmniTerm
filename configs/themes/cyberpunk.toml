# --- CLEAN TWO-LINE PROMPT ---
format = """[ $directory ](bg:#1e293b fg:#38bdf8)[git: $git_branch $git_status](bg:#1e293b fg:#c084fc)[ ${custom.project}](bg:#1e293b)[ $azure](bg:#1e293b)[ $kubernetes](bg:#1e293b)[ $aws](bg:#1e293b)[ ${custom.cpu}](bg:#1e293b)[ $cmd_duration ](bg:#1e293b fg:#facc15)
$character"""
right_format = '$time ${custom.project}'

[directory]
style = "bold fg:#38bdf8 bg:#1e293b"
format = "[$path]($style)"
truncate_to_repo = true

[git_branch]
symbol = " "
style = "fg:#c084fc bg:#1e293b"
format = 'on [$symbol$branch(:$remote_branch)]($style)'

[git_status]
style = "fg:#fb923c bg:#1e293b"
format = '[$all_status$ahead_behind]($style)'
ahead = '⇡'
behind = '⇣'
diverged = '⇕'

# --- AZURE ---
[azure]
symbol = "󰠅 "
format = '[$symbol($subscription)]($style)'
style = "fg:#38bdf8 bg:#1e293b"
disabled = false

# --- KUBERNETES & PRODUCTION ALARM ---
[kubernetes]
symbol = "☸ "
format = 'on [⛵ ($user on )($cluster in )$context \($namespace\)]($style) '
style = "fg:#4ade80 bg:#1e293b"
disabled = false

[[kubernetes.contexts]]
context_pattern = "(?i).*prod.*"
style = "bold bg:#ef4444 fg:#ffffff"

[[kubernetes.contexts]]
context_pattern = "(?i).*(staging|uat).*"
style = "bold bg:#eab308 fg:#000000"

# --- AWS ---
[aws]
symbol = "☁️ "
format = '[$symbol($profile)]($style)'
style = "fg:#fbbf24 bg:#1e293b"
disabled = false

# --- SYSTEM METRICS (CPU SKULL) ---
[custom.cpu]
command = "ps -A -o %cpu | awk -v cores=$(sysctl -n hw.ncpu) '{s+=$1} END {printf(\"%.0f%%\", s/cores)}'"
when = "true"
style = "fg:#f87171 bg:#1e293b"
format = '[💀 $output]($style)'

# --- COMMAND DURATION (e.g., took 4s) ---
[cmd_duration]
min_time = 2000
style = "fg:#facc15 bg:#1e293b"
format = '[took $duration]($style)'
disabled = false

# --- TIME MODULE ---
[time]
disabled = false
time_format = "%I:%M %p"
style = "bold fg:#fb923c"
format = '[\[$time\]]($style)'

[custom.project]
command = '''repo_root=$(git rev-parse --show-toplevel 2>/dev/null); if [ -n "$repo_root" ]; then basename "$repo_root"; else basename "$PWD"; fi'''
when = "true"
style = "bold fg:#ff00ff"
format = '[󰧑 $output]($style)'

[character]
success_symbol = '[❯](bold #ff00ff)'
error_symbol = '[❯](bold #ff0055)'